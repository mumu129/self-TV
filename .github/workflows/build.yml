name: Build Tauri App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*" # 推送 v1.0.0 这样的 tag 时，自动发布到 Releases
  workflow_dispatch: # 支持在网页端手动点击触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # 允许 Action 创建 Release
    permissions:
      contents: write

    strategy:
      fail-fast: false # 一个系统报错不影响其他系统
      matrix:
        # 涵盖三大主流系统
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run tauri:build

      # 将打包好的文件上传为 Artifacts，可以随时下载
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Self-TV-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

      # 如果推送了 tag，自动创建一个 Release 并附带安装包
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
