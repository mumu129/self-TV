name: Build Electron App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # 推送 v1.0.0 这样的 tag 时，自动发布到 Releases
  workflow_dispatch: # 支持在网页端手动点击触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # 允许 Action 创建 Release
    permissions:
      contents: write

    strategy:
      fail-fast: false # 一个系统报错不影响其他系统
      matrix:
        # 涵盖三大主流系统
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          # 使用淘宝镜像加速 Electron 的下载，防止超时
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Build Application
        run: npm run build
        env:
          # 允许 electron-builder 在打 tag 时发布 Release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将打包好的文件上传为 Artifacts，可以随时下载
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Player-${{ matrix.os }}
          # 你的配置里输出在 release/${version}，所以用通配符抓取所有安装包
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.zip
          if-no-files-found: error

      # 如果推送了 tag，自动创建一个 Release 并附带安装包
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}